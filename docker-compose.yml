services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifestack
      POSTGRES_PASSWORD: lifestack_dev
      POSTGRES_DB: lifestack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifestack -d lifestack"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
